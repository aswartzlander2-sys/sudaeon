# Sudaeon enforcement configuration - generated file, do not edit.
schema=1
enabled=1
enforcing_now=0
fail_closed=1
audit=1
max_attempts=4
prompt_timeout=90
lockout_seconds=60
prompt_prefix=[Sudaeon]
prompt_text=Please Enter the Master Password:
chkpwd=/usr/lib/sudaeon/sudaeon-chkpwd
verifier=/var/lib/sudaeon/master.verifier
recovery_verifier=/var/lib/sudaeon/recovery.verifier
power_button=require_master
default_require=1

[schedule]
mode=enforce_during
window=Mon,Tue,Wed,Thu,Fri,21:00,07:00
window=Sat,Sun,09:00,17:00

[action:reboot]
blocked=1
require_master=1
bypass=1

[action:poweroff]
blocked=0
require_master=0
bypass=1

[action:halt]
blocked=0
require_master=0
bypass=1

[action:suspend]
blocked=0
require_master=0
bypass=1

[action:hibernate]
blocked=0
require_master=0
bypass=1

[action:hybrid_sleep]
blocked=0
require_master=0
bypass=1

[action:suspend_then_hibernate]
blocked=0
require_master=0
bypass=1

[action:kexec]
blocked=0
require_master=0
bypass=1

[action:soft_reboot]
